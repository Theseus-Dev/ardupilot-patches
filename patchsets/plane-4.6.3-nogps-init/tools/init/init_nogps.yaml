# Sample initialization config for the Plane 4.6.3 no-GPS init patchset.
#
# Edit the position/wind values before each flight (or generate from your
# companion's nav pipeline) and run init_nogps.py.

mavlink:
  # MAVLink endpoint to the autopilot.
  # SITL:        tcp:127.0.0.1:5760
  # USB serial:  /dev/ttyACM0 (or COM3 on Windows)
  # Telem radio: /dev/ttyUSB0
  connection: tcp:127.0.0.1:5760
  baud: 57600                   # ignored for tcp/udp
  source_system: 254            # GCS-side sysid
  target_system: 1              # autopilot sysid (1 is default)

# Plane's location on the ground at startup.
# This single point is used for: EKF origin, AHRS home, and the EKF's
# initial position state. If you want a fixed reference frame separate
# from the actual takeoff point, edit the script — but for a plane on a
# runway this is the right knob.
position:
  lat:  -35.363261              # degrees
  lon:  149.165230
  alt:  584.0                   # metres MSL
  accuracy_m: 5.0               # horizontal accuracy of this estimate

# Current wind. (0, 0) is acceptable when unknown but velocity tracking
# will degrade in flight.
wind:
  speed_ms:  0.0                # m/s
  direction_deg: 0.0            # 0 = from N, clockwise (standard met)

# Timing between commands. Conservative defaults for slow links.
delays_s:
  after_origin: 1.0
  after_home: 1.0
  after_position: 2.0           # gives EKF time to emit STATUSTEXT
  after_wind: 1.0

# Wait for each STATUSTEXT confirmation. Disable if your link drops them.
verify:
  bootstrap_statustext: true
  wind_statustext: true
  timeout_s: 5.0
